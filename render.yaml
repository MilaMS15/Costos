services:
  # ==========================================
  # 1. SERVICIO BACKEND (Flask API)
  # ==========================================
  - type: web
    name: costos-backend
    env: python
    plan: free
    rootDir: BACKEND
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PORT
        value: 10000

  # ==========================================
  # 2. SERVICIO FRONTEND (Sitio Estático)
  # ==========================================
  - type: web
    name: costos-frontend
    env: static
    plan: free
    staticPublishPath: FRONTEND
    routes:
      - type: rewrite
        source: /
        destination: /login.html
