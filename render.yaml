services:
  - type: web
    name: costos-backend
    env: python
    plan: free
    rootDir: BACKEND
    buildCommand: |
      python --version
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PORT
        value: 10000

  - type: web
    name: costos-frontend
    env: static
    plan: free
    staticPublishPath: FRONTEND
    routes:
      - type: rewrite
        source: /
        destination: /login.html