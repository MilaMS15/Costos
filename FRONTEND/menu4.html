<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unik'a | Costos Industriales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="js/config.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; padding-top: 70px; }

<body class="bg-gray-50">

            <div class="p-4 bg-gray-50 rounded-xl inline-flex items-center gap-2 border border-gray-100 text-sm font-medium text-gray-600">
